<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paisa</title>
  <meta name="description" content="Personal budget, goals, debts and investments with voice entry">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paisa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
    <h1 id="monthLabel">—</h1>
    <button class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
    <span id="syncDot" class="sync-dot" title="Sync status"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="home" class="active"><span>🏠</span>Home</button>
    <button data-tab="budget"><span>📊</span>Budget</button>
    <button id="micFab" class="fab" aria-label="Add entry by voice"><span>🎤</span></button>
    <button data-tab="plan"><span>🎯</span>Plan</button>
    <button data-tab="more"><span>⚙️</span>More</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
